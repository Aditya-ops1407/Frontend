<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video and Audio Tag</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 class="css">Video</h1>
    <div>
        <video src="Your Name 4K Live wallpaper.mp4" controls height="400" loop></video>
        <br>
        <h1 class="css">Audio</h1>
        <audio src="Fahhh - QuickSounds.com.mp3" controls preload="auto"></audio>
        <br>

        <!-- Scalable Vector Images -->
        <h1 class="css">SVG</h1>
        <svg height="30" width="30">
            <rect width="30" height="30" style="fill:rgb(0,0,255);stroke-width:1;stroke:rgb(0,0,0)" />
        </svg>
        <br>
        <svg height="100" width="100">
            <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
        </svg>
        <br>

        <!-- iFrames to embed another webpage within the current webpage -->
        <h1 class="css">iFrame</h1>
        <iframe src="https://www.codewithharry.com/tutorial/html-iframes" frameborder="0" height="500"
            width="560"></iframe>
        <iframe width="560" height="315"
            src="https://www.youtube.com/embed/XZwBNDGuWGU?si=Rdw_eRdIshlh_WhP&amp;start=761"
            title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    </div>
</body>

</html>
